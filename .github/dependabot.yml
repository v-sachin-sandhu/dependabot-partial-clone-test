version: 2
updates:
  # Runs the hosted Dependabot against the fixtures in .github/workflows. The cooldown makes the
  # updater read release dates, which is the bare clone for actions without GitHub releases.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Runs the hosted Dependabot against mix/, a git dependency on saadeghi/daisyui (about 11.8 GiB).
  # The cooldown makes the updater read the dependency's tag dates from a bare clone.
  - package-ecosystem: mix
    directory: /mix
    schedule:
      interval: weekly
    cooldown:
      default-days: 25
